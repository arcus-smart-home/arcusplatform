 configurations.all {
    resolutionStrategy {
        force 'org.mockito:mockito-core:1.10.19'
    }
}

apply from: file("${rootDir}/gradle/subproject.gradle")
apply from: file("${rootDir}/gradle/container.gradle")

dependencies {
	implementation libraries.commons_lang

	api project (':platform:arcus-lib')
	api project (':common:arcus-client')
	api project (':common:arcus-common')
	api project (':common:arcus-metrics')

	implementation libraries.mailgun
	implementation libraries.sendgridJava
	implementation libraries.sendgridHTTP
	implementation libraries.httpClient
	implementation libraries.pushy
	implementation libraries.smackCore
	implementation libraries.smackTCP
	implementation libraries.smackExt
	implementation libraries.twilio
	implementation libraries.apacheCommonsValidator
	implementation netty_all

	testImplementation project (':platform:arcus-test')
	testImplementation libraries.mockito
	testImplementation libraries.mockito
	testImplementation libraries.powermock_junit
	testImplementation libraries.powermock_mockito
}

// PowerMock 1.7.x is incompatible with JDK 12+ (Objenesis/reflection issues).
// Exclude PowerMock-based tests until PowerMock is upgraded to 2.0+ with Mockito 2.x.
if (!isJava8) {
	test {
		exclude '**/MailgunEmailProviderTest.class'
	}
}


// project specific build settings, dependencies, etc.
apply from: file("${rootDir}/gradle/subproject.gradle")
apply from: file("${rootDir}/gradle/container.gradle")

dependencies {
   api project(':platform:arcus-alexa')
   api project(':platform:arcus-google')
   implementation libraries.httpClient
   implementation libraries.cassandraDriverQueryBuilder
   
   implementation 'io.netty:netty-tcnative-boringssl-static:2.0.75.Final'
   implementation 'com.google.auth:google-auth-library-oauth2-http:0.10.0'
   implementation 'com.google.api.grpc:googleapis-common-protos:0.0.3'
   implementation 'io.grpc:grpc-netty-shaded:1.10.0'
   implementation 'io.grpc:grpc-protobuf:1.10.0'
   implementation 'io.grpc:grpc-stub:1.10.0'
   implementation 'io.grpc:grpc-auth:1.10.0'

   testImplementation project(':platform:arcus-test')
   testImplementation project(':common:arcus-model:platform-client')
}

apply plugin: 'com.google.protobuf'

sourceSets {
   main {
      java {
         srcDirs 'build/generated/source/proto/main/grpc'
         srcDirs 'build/generated/source/proto/main/java'
      }
   }
}

buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    // ASSUMES GRADLE 2.12 OR HIGHER. Use plugin version 0.7.5 with earlier
    // gradle versions
    classpath 'com.google.protobuf:protobuf-gradle-plugin:0.8.10'
  }
}

protobuf {
  protoc {
    artifact = "com.google.protobuf:protoc:3.5.1-1"
  }
  plugins {
    grpc {
      artifact = 'io.grpc:protoc-gen-grpc-java:1.10.0'
    }
  }
  generateProtoTasks {
    all()*.plugins {
      grpc {}
    }
  }
}


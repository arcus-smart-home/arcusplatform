kafka.group=api-bridge
bridge.name=api
# listen to all partitions so that any api-bridge can receive any response
partition.assignment=ALL
# don't save offsets for a bridge, just always jump to the latest and run with it
kafka.offsets.transient=true
port=8085
healthcheck.http.port=9081
web.socket.path=apibus
message.prefix=CLNT:api:

# a key's permissions don't say which place an addressed object belongs to, so keys need both
authz.algorithm=layered

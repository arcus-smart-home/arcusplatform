apply from: file("${rootDir}/gradle/subproject.gradle")
apply from: file("${rootDir}/gradle/groovy.gradle")


sourceSets.main.java.srcDirs = []
sourceSets.main.groovy.srcDirs += ["src/main/java"]
//sourceSets.test.groovy.srcDirs += ["src/test/java"]

sourceSets {
	cucumber {
		groovy.srcDirs = ["src/test/java"]
		resources.srcDirs = ["src/cucumber/resources"]
		compileClasspath += sourceSets.main.output + sourceSets.test.output
		runtimeClasspath += sourceSets.main.output + sourceSets.test.output
	}
}

configurations {
	cucumberRuntime {
		extendsFrom testImplementation, testRuntimeOnly
	}
	cucumberImplementation.extendsFrom testImplementation
	cucumberRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	api project (':common:arcus-drivers:drivers-common')
	api project (':common:arcus-drivers:groovy-bindings')
	api project (':common:arcus-protocol')

	api project(':platform:arcus-containers:driver-services')
	api project(':platform:arcus-lib')
	api project(':platform:arcus-test')
	api project(':common:arcus-common')
	
	implementation libraries.cucumber
	implementation libraries.groovy
}

test {
	exclude '**/*.feature'
}


task cucumber(type: JavaExec, dependsOn: compileCucumberGroovy) {
	def cmdLineTags = ""
	if(project.hasProperty("tags")){
		cmdLineTags="$tags"
	}

	def reportsDir = ""
	if(project.hasProperty("reports")){
		reportsDir="$reports"
	}
	else {
		reportsDir = buildDir
	}
	
	//allow assertions to work in java files
	jvmArgs += ["-ea"]

	def cukeArgs = [
			'--glue',
			'src/test/java/com/iris/driver/unit/',
	]
	
	def plugins = [
		"html:$reportsDir/test-results/cucumber",
		"json:$reportsDir/test-results/cucumber.json",
		"junit:$reportsDir/test-results/cucumber.xml"
	]
	plugins << 'pretty';
	plugins.each { cukeArgs << '--plugin' << it }

	if(cmdLineTags){
		cmdLineTags.tokenize("+").each {
			cukeArgs << "--tags"
			cukeArgs << it
		}
	} else {
		cukeArgs << '--tags'
		cukeArgs << "~@Ignore"
	}
	if(project.hasProperty('features') && !features.isEmpty()) {
		features.tokenize(",").each {
			cukeArgs << "src/cucumber/resources/com/iris/driver/unit/$it"
		}
	}
	else {
		cukeArgs << 'src/cucumber/resources/com/iris/driver/unit/zw'
		cukeArgs << 'src/cucumber/resources/com/iris/driver/unit/zb'
		cukeArgs << 'src/cucumber/resources/com/iris/driver/unit/ipcd'
	}
	//println cukeArgs
	//println allJvmArgs
	mainClass = "cucumber.api.cli.Main"
	classpath = configurations.cucumberRuntime + sourceSets.main.output + sourceSets.test.output + sourceSets.cucumber.output
	args = cukeArgs
}


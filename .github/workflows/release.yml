name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['11', '17', '21']
    name: Test (JDK ${{ matrix.java-version }})
    steps:
      - uses: actions/checkout@v4
      # JDK 8 is only for the agent's Java 8 toolchain (found via ~/.m2/toolchains.xml);
      # the last version listed is the default JDK that runs Gradle.
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            ${{ matrix.java-version }}
          distribution: 'corretto'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew test -x spotbugsMain -x spotbugsTest -x spotbugsJmh --no-daemon

  build-and-push-image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # JDK 8 is only for the agent's Java 8 toolchain; 21 (listed last) runs Gradle
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            21
          distribution: 'corretto'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build jars
        run: ./gradlew jar --no-daemon

      - name: Build and push containers
        run: bash khakis/bin/release.sh
        env:
          REGISTRY_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REGISTRY_SEPARATOR: '-'

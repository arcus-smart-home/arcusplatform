name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['8', '11']
    name: Test (JDK ${{ matrix.java-version }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'corretto'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      - name: Run tests
        run: ./gradlew clean test -x spotbugsMain -x spotbugsTest -x spotbugsJmh --no-daemon

  build-and-push-image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build jars
        run: ./gradlew clean jar --no-daemon

      - name: Build and push containers
        run: bash khakis/bin/release.sh
        env:
          REGISTRY_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REGISTRY_SEPARATOR: '-'

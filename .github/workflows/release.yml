name: Release

on:
  push:
    tags:
      - 'v*'
  schedule:
    # Mondays, 09:17 UTC. Builds only when the gate in `prepare` says something
    # changed, with a 30 day floor so quiet months still get a rebuild.
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if nothing has changed'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # For a tag push this just passes the tag through. For a scheduled or manual
  # run it decides whether a build is warranted, and if so bumps the version,
  # commits it to master and creates the tag to build.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build: ${{ steps.decide.outputs.build }}
      ref: ${{ steps.decide.outputs.ref }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide what to build
        id: decide
        env:
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            echo "Tag push: building ${GITHUB_REF_NAME}"
            {
              echo "build=true"
              echo "ref=${GITHUB_REF_NAME}"
              echo "version=${GITHUB_REF_NAME#v}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STATE=.github/release-state.json
          REASONS=()

          # 1. Code changes since the last release.
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            REASONS+=("no release tag found")
          else
            COMMITS=$(git rev-list --count "${LAST_TAG}..HEAD")
            if [ "$COMMITS" -gt 0 ]; then
              REASONS+=("${COMMITS} commit(s) since ${LAST_TAG}")
            fi
          fi

          # 2. The base image moved. Every service image is FROM arcus/java,
          #    which is built from this base, so its digest covers them all.
          BASE=$(awk '/^FROM /{print $2; exit}' khakis/arcus-java/Dockerfile)
          # The plain {{.Manifest.Digest}} form silently falls back to the
          # default listing on some buildx versions; the json form is reliable.
          DIGEST=$(docker buildx imagetools inspect "$BASE" --format '{{json .Manifest.Digest}}' | tr -d '"')
          PREV_DIGEST=$(jq -r '.base_digest // ""' "$STATE" 2>/dev/null || echo "")
          if [ "$DIGEST" != "$PREV_DIGEST" ]; then
            REASONS+=("${BASE} is now ${DIGEST:0:19}, last built ${PREV_DIGEST:0:19}")
          fi

          # 3. Monthly floor.
          LAST_BUILD=$(jq -r '.last_build // ""' "$STATE" 2>/dev/null || echo "")
          # An unreadable timestamp has to mean "build", not "skip", or a
          # corrupt state file would quietly switch the floor off.
          LAST_EPOCH=$(date -u -d "$LAST_BUILD" +%s 2>/dev/null || echo "")
          if [ -z "$LAST_EPOCH" ]; then
            REASONS+=("no usable build timestamp recorded")
          else
            AGE=$(( ( $(date -u +%s) - LAST_EPOCH ) / 86400 ))
            if [ "$AGE" -ge 30 ]; then
              REASONS+=("${AGE} days since the last build")
            fi
          fi

          if [ "${FORCE:-false}" = "true" ]; then
            REASONS+=("manually forced")
          fi

          if [ ${#REASONS[@]} -eq 0 ]; then
            echo "Nothing has changed, not building."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Building because:\n'
          printf '  - %s\n' "${REASONS[@]}"

          # Image tags come from version.properties, not from the git tag, so
          # the version has to be bumped or this run would overwrite the images
          # of the last release. Patch bump within the month, reset on a new one.
          prop() { grep -m1 "^$2=" "$1" | cut -d= -f2- | tr -d '[:space:]'; }
          MAJOR=$(prop khakis/version.properties major)
          MINOR=$(prop khakis/version.properties minor)
          PATCH=$(prop khakis/version.properties patch)

          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          if [ "$MAJOR" = "$YEAR" ] && [ "$MINOR" = "$MONTH" ]; then
            PATCH=$((PATCH + 1))
          else
            MAJOR=$YEAR
            MINOR=$MONTH
            PATCH=0
          fi
          while git rev-parse -q --verify "refs/tags/v${MAJOR}.${MINOR}.${PATCH}" >/dev/null; do
            PATCH=$((PATCH + 1))
          done
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Releasing v${VERSION}"

          for f in khakis/version.properties platform/version.properties; do
            sed -i -E "s/^major=.*/major=${MAJOR}/; s/^minor=.*/minor=${MINOR}/; s/^patch=.*/patch=${PATCH}/" "$f"
          done

          jq -n \
            --arg base_image "$BASE" \
            --arg base_digest "$DIGEST" \
            --arg last_build "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg last_version "$VERSION" \
            '{base_image: $base_image, base_digest: $base_digest, last_build: $last_build, last_version: $last_version}' \
            > "$STATE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add khakis/version.properties platform/version.properties "$STATE"
          git commit -m "Release v${VERSION}" -m "$(printf '%s\n' "${REASONS[@]}" | sed 's/^/- /')"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${VERSION}"

          {
            echo "build=true"
            echo "ref=v${VERSION}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

  tests:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['21']
    name: Test (JDK ${{ matrix.java-version }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'corretto'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew test -x spotbugsMain -x spotbugsTest -x spotbugsJmh --no-daemon

  build-and-push-image:
    needs: [prepare, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build jars
        run: ./gradlew jar --no-daemon

      - name: Build and push containers
        run: bash khakis/bin/release.sh
        env:
          REGISTRY_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REGISTRY_SEPARATOR: '-'

      - name: Summary
        run: |
          echo "Published \`${{ needs.prepare.outputs.version }}\` from \`${{ needs.prepare.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"

# Dependabot configuration.
#
# Gradle note: library versions live in gradle/dependencies.gradle, which is
# applied from the root build.gradle with a literal path so Dependabot can
# follow it (it only reads files pulled in by `apply from` when the path is a
# plain string and the filename contains "dependencies").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
    # More groups means more PRs; the previous limit of 8 was being hit, which
    # silently held back whatever did not fit.
    open-pull-requests-limit: 12
    commit-message:
      prefix: "deps"
    ignore:
      # Closed-source jar vendored in libs/, not published to any repository.
      - dependency-name: "ipcd-lib:ipcd-lib"

      # Cucumber is frozen at 6.10.4 because io.cucumber:cucumber-groovy was
      # discontinued: its last release is 6.10.4 (June 2021) and there is no
      # 7.x or 8.x artifact at all. cucumber-junit and cucumber-java have to
      # stay on the same core version, so none of the three can move until the
      # Groovy step definitions behind the driver tests are ported to
      # cucumber-java.
      - dependency-name: "io.cucumber:*"

      # Shiro 2.x/3.x is a known migration, not a bump. Patch and minor on the
      # 1.13 line are still welcome.
      - dependency-name: "org.apache.shiro:*"
        update-types: ["version-update:semver-major"]

      # handlebars past 4.3.1 is compiled for Java 17, and javac 11 cannot read
      # those class files, so it fails the JDK 11 build that hubs require. The
      # capability generator, protoc and protocol-generator all compile against
      # it under --release 11. Revisit if those three move to a Java 17
      # toolchain, or if the JDK 11 leg goes away.
      - dependency-name: "com.github.jknack:handlebars"
        versions: [">= 4.4"]

      # Lucene 10 is compiled for Java 21 and javac 11 cannot read a major 65
      # class file, so arcus-prodcat fails the JDK 11 build that hubs require.
      # 9.12.3 is the newest release still built for Java 11. Revisit if the
      # JDK 11 leg goes away. The 10.x API the search code would need is
      # already in use, so that move should be a version bump alone.
      - dependency-name: "org.apache.lucene:*"
        versions: [">= 10"]

      # Guice 7 dropped javax.inject in favour of jakarta.inject. 63 files here
      # import javax.inject (42 @Inject, 30 @Singleton, 6 @Named), and some of
      # the @Named uses are not injection at all: ReflectiveCapabilityBuilder
      # and the capability driver tests read it as a reflection marker for
      # method naming, so they break simply because Guice 7 stops supplying
      # javax.inject transitively. Minor and patch on 6.x are still welcome.
      - dependency-name: "com.google.inject*:*"
        update-types: ["version-update:semver-major"]
    groups:
      # Keep coupled artifacts in one PR, and keep unrelated ones out of it, so
      # that one stuck library cannot hold the rest hostage. The catch-all below
      # is deliberately last and deliberately small.
      netty:
        patterns:
          - "io.netty:*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*:*"
      logging:
        patterns:
          - "org.slf4j:*"
          - "ch.qos.logback:*"
      testing:
        patterns:
          - "junit:junit"
          - "org.easymock:*"
          - "org.mockito:*"
          - "org.hamcrest:*"
      apache-commons:
        patterns:
          - "commons-*:*"
          - "org.apache.commons:*"
      metrics:
        patterns:
          - "io.dropwizard.metrics:*"
          - "io.prometheus:*"
          - "org.hdrhistogram:*"
          - "org.mpierce.metrics.reservoir:*"
      google:
        patterns:
          - "com.google.guava:*"
          - "com.google.inject*:*"
          - "com.google.code.gson:*"
          - "com.google.code.findbugs:*"
      datastore:
        patterns:
          - "com.datastax.oss:*"
          - "org.apache.kafka:*"
          - "org.apache.zookeeper:*"
      # The antlr4 tool and antlr4-runtime have to move together: a generated
      # parser records the serialized-ATN version it was built with and the
      # runtime refuses to load one it does not recognise, so a split update
      # breaks the build at startup rather than at compile time.
      antlr:
        patterns:
          - "org.antlr:antlr4"
          - "org.antlr:antlr4-runtime"
      # Major updates fall outside the minor-and-patch catch-all below, so
      # dependabot proposes them one artifact at a time: #454 and #458 were
      # byte-identical rewrites of all three coordinates, opened as two PRs.
      # Group them so a Lucene move is one PR to judge rather than three.
      lucene:
        patterns:
          - "org.apache.lucene:*"
      gradle-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - "/khakis/arcus-java"
      - "/khakis/arcus-kairosdb"
      - "/agent/arcus-hal/hub-v2/docker"
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
    ignore:
      # Built locally by khakis/bin, never pulled from a registry.
      - dependency-name: "arcus/java"
      # The kairosdb builder stage is pinned to JDK 11 on purpose: the
      # KairosDB 1.2.2 build (tablesaw) does not compile on anything newer.
      # Patch and minor bumps of 11-jdk-jammy are still welcome.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

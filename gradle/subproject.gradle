repositories {
   if ("${use_maven_local}" == "true") {
      mavenLocal()
   }

   mavenCentral()

    flatDir {
        dirs "$rootDir/libs"
    }
}


apply plugin: 'java-library'
apply plugin: 'maven-publish'
apply plugin: 'nebula.contacts'
apply plugin: 'project-report'
apply plugin: 'eclipse'
apply plugin: "com.github.spotbugs"

spotbugs {
   ignoreFailures = true
}

if (project.hasProperty('eyeris_owasp')) {
    if (eyeris_owasp?.trim()) {
        apply plugin: "org.owasp.dependencycheck"

        dependencyCheck {
            format = "ALL"
            suppressionFile = "${rootDir}/gradle/owasp/suppression.xml"
            hintsFile = "${rootDir}/gradle/owasp/hints.xml"
            skipConfigurations = ["test", "testRuntimeOnly", "systemTest", "systemTestRuntimeOnly"]
        }
    }
}

apply from: file("${rootDir}/gradle/dependencies.gradle")

// Guava 32+ publishes Gradle Module Metadata with JRE and Android variants.
// Explicitly select the standard-jvm (JRE) variant on all configurations.
// Also pin Guice to 4.0 — shiro-guice 1.13.0 transitively requests 4.2.3 which
// has stricter null-checking for @Provides methods, breaking existing tests.
configurations.all {
   attributes {
      attribute(org.gradle.api.attributes.java.TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
               objects.named(org.gradle.api.attributes.java.TargetJvmEnvironment, org.gradle.api.attributes.java.TargetJvmEnvironment.STANDARD_JVM))
   }
   // guice 5.x bundles multibindings in core jar; exclude old transitive versions
   exclude group: 'com.google.inject.extensions', module: 'guice-multibindings'
}

// Shared test dependencies for all subprojects
dependencies {
   testImplementation libraries.junit
   testImplementation libraries.easymock
   testImplementation libraries.logback
   testImplementation 'commons-lang:commons-lang:2.6'
   testImplementation 'org.hamcrest:hamcrest-all:1.3'
}

// Gate Java 11 changes based on the JDK running Gradle
ext.isJava8 = JavaVersion.current() == JavaVersion.VERSION_1_8
ext.javaCompatibility = ext.isJava8 ? '1.8' : JavaVersion.current().toString()

ext.cpus = project.hasProperty('cpus') ? project.cpus : 2;
ext.mem = project.hasProperty('mem') ? project.mem.toInteger() : 512; // docker memory max
ext.instances = project.hasProperty('instances') ? project.instances : 1;
ext.jvmMem = (0.8 * mem).intValue(); // jvm memory max


version = buildVersion
sourceCompatibility = javaCompatibility
targetCompatibility = javaCompatibility

sourceSets {

    systemTests {
        java.srcDir file('src/system-test/java')
        resources.srcDir file('src/system-test/resources')
        compileClasspath += sourceSets.test.compileClasspath
        compileClasspath += sourceSets.test.output
        runtimeClasspath += sourceSets.test.runtimeClasspath
        runtimeClasspath += sourceSets.test.output
    }
}

task individualSystemTest(type: Exec,dependsOn: testClasses) {
    group "Verification"
    description "Runs a single system test - DOES call startPlatform DOES start services DOES pre load data DOES NOT STOP services/platform"

    args "$rootProject.projectDir", "singleSystemTest"
    executable "$rootProject.projectDir/testRunner.sh"
}

// This assumes you have already run startPlatform and can be used for individual tests.
task systemTestRunner(type: Test,dependsOn: testClasses) {
    group "Verification"
    dependsOn testClasses
    testClassesDirs = sourceSets.systemTests.output
    classpath = sourceSets.systemTests.runtimeClasspath

    description = "Runs the system tests located in src/system-test/java. Assumes you have already called startPlatform"
    reports.junitXml.outputLocation = file("$buildDir/reports/system-tests/xml")
    reports.html.outputLocation = file("$buildDir/reports/system-tests/html")
	
	testLogging {
	   events "passed", "failed"
	   showExceptions true
	   showCauses true
	   minGranularity 3 // Shows down to the method.
   }
	   
   outputs.upToDateWhen { // Always run these tests. Even if "Up-to-date"
	   false
	}
}

tasks.withType(Tar) {
   compression = Compression.GZIP
   extension = "tar.gz"
}

test {
    //we want display the following test events
    testLogging {
        events "STARTED", "PASSED", "FAILED", "SKIPPED"
    }
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
}

if ("${use_jacoco}" == "true") {
   apply plugin: 'jacoco'

   jacoco {
      toolVersion = "0.7.4.201502262128"
   }

   jacocoTestReport.dependsOn 'test'
   check.dependsOn 'jacocoTestReport'
}

ext.sharedManifest = manifest {
   attributes(
      'Implementation-Title': project.name,
      'Implementation-Version': project.version,
      'Implementation-Vendor': "Arcus Project"
   )
}

jar.manifest = sharedManifest
jar {
   entryCompression = ZipEntryCompression.STORED
}

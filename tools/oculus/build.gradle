apply from: file("${rootDir}/gradle/subproject.gradle")
apply from: file("${rootDir}/gradle/application.gradle")

dependencies {
   api project(':common:arcus-billing')
   api project(':common:arcus-common')
   api project(':common:arcus-protocol')
   api project(':common:arcus-model:platform-client')
   api project(':common:arcus-model')

   api project(':platform:arcus-lib')

   implementation libraries.jcommander
   implementation libraries.swingx // for JXCollapsiblePanel
   implementation netty
   implementation libraries.httpClient
   implementation libraries.natty
   implementation libraries.antlr
   implementation 'com.google.code.findbugs:jsr305:3.0.1'

   testImplementation libraries.mockito
}
configurations
        {   all*.exclude group: 'io.netty', module:'netty-all'
        }

mainClassName = 'com.iris.oculus.Main'



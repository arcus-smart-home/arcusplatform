// project specific build settings, dependencies, etc.

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

// Support for JAXB bindings
ext.generatedSrcDir = 'src/generated/java'
ext.xsdDir = "${rootDir}/common/arcus-protocol/src/main/resources/definition/ipcd/schema"

configurations {
    jaxb
}

dependencies {
    jaxb libraries.jaxb_xjc
    jaxb libraries.jaxb_impl
    jaxb libraries.jaxb_api
    jaxb libraries.javax_activation_api

    implementation libraries.jaxb_api
    implementation libraries.jaxb_impl
    implementation libraries.commons_lang
    implementation libraries.handlebars
    implementation libraries.jcommander
}

sourceSets {
    main {
        java {
            srcDir generatedSrcDir
        }
    }
}

// Replaces the jacobono jaxb plugin (incompatible with Gradle 7+)
task xjcDefinition(type: JavaExec) {
    description 'Generate JAXB classes from ipcd-definition.xsd'
    classpath = configurations.jaxb
    mainClass = 'com.sun.tools.xjc.XJCFacade'

    def outputDir = file(generatedSrcDir)
    inputs.file "${xsdDir}/ipcd-definition.xsd"
    outputs.dir outputDir

    doFirst { outputDir.mkdirs() }

    args = ['-d', outputDir, '-p', 'com.iris.protocol.ipcd.xml.model',
            "${xsdDir}/ipcd-definition.xsd"]
}

task xjcAos(type: JavaExec) {
    description 'Generate JAXB classes from ipcd-aos.xsd'
    classpath = configurations.jaxb
    mainClass = 'com.sun.tools.xjc.XJCFacade'

    def outputDir = file(generatedSrcDir)
    inputs.file "${xsdDir}/ipcd-aos.xsd"
    outputs.dir outputDir

    doFirst { outputDir.mkdirs() }

    args = ['-d', outputDir, '-p', 'com.iris.protocol.ipcd.aos.xml.model',
            "${xsdDir}/ipcd-aos.xsd"]
}

task xjc {
    dependsOn xjcDefinition, xjcAos
}

task cleanGeneratedSource(type: Delete) {
    delete generatedSrcDir
}

clean.dependsOn cleanGeneratedSource

compileJava.dependsOn xjc
compileTestJava.dependsOn xjc

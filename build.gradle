def jvmVersion = JavaVersion.current()
if (jvmVersion != JavaVersion.VERSION_1_8 && jvmVersion != JavaVersion.VERSION_11) {
   throw new GradleException(
      "Arcus requires Java 8 or 11 to build. Current JVM is Java ${jvmVersion}.\n" +
      "Set JAVA_HOME to a supported JDK, e.g.:\n" +
      "  export JAVA_HOME=/usr/lib/jvm/temurin-11-jdk-amd64"
   )
}
